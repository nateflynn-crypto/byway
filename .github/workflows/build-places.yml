name: Build places index

# Monthly snapshot of the OpenStreetMap places Byway looks for along the US East Coast (the Northeast
# region plus the coastal states south of it), published to the places-data branch (replaced each
# time, so the repo doesn't grow) and served to the app by jsDelivr.
on:
  schedule:
    - cron: '17 6 3 * *'   # 06:17 UTC on the 3rd of each month
  workflow_dispatch:       # Actions tab → Build places index → Run workflow

permissions:
  contents: write

concurrency:
  group: build-places
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REGION: us-east-coast
      GEOFABRIK: https://download.geofabrik.de/north-america
      # Geofabrik extracts, relative to $GEOFABRIK: the Northeast region plus each coastal state south of it.
      EXTRACTS: >-
        us-northeast
        us/delaware us/maryland us/district-of-columbia us/virginia
        us/north-carolina us/south-carolina us/georgia us/florida
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Download the OpenStreetMap extracts
        run: |
          mkdir -p extracts
          for e in $EXTRACTS; do
            n=$(basename "$e")
            curl -fsSL --retry 3 -o "extracts/$n.osm.pbf" "$GEOFABRIK/$e-latest.osm.pbf"
            curl -fsSL --retry 3 -o "extracts/$n.poly" "$GEOFABRIK/$e.poly"
          done
          ls -lh extracts

      - name: Build the index
        run: |
          pbfs=(); polys=()
          for e in $EXTRACTS; do n=$(basename "$e"); pbfs+=("extracts/$n.osm.pbf"); polys+=("extracts/$n.poly"); done
          python3 tools/build_places.py --pbf "${pbfs[@]}" --poly "${polys[@]}" --region "$REGION" --out out/places/v1

      - name: Publish to the places-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          printf '# Byway places index\n\nGenerated by .github/workflows/build-places.yml from OpenStreetMap data (© OpenStreetMap contributors, ODbL) via Geofabrik. Replaced monthly; do not edit.\n' > README.md
          git init -q -b places-data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Places index ($REGION) $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" places-data

      - name: Refresh the CDN copy of the manifest
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@places-data/places/v1/index.json" || true
